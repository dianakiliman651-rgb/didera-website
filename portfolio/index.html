<style>
/* Layout: a living cover (her desk scene, split into depth layers), then one corridor of windows in the same taupe and burgundy room. */
:root{
  color-scheme:dark;
  --ink:#1a1514;
  --taupe:#2c2522;
  --stone:#4a403b;
  --wine:#7a2433;
  --wine-hi:#a23a4b;
  --cream:#f1e6da;
  --mute:#c2b4a8;
  --line:rgba(241,230,218,.2);
  --glass:rgba(66,56,51,.5);
  --display:"Playfair Display","Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --u:1px;--mx:0;--my:0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400;text-wrap:balance}

/* 3D lettering, shared by every title */
.d3-s{text-shadow:0 1px 0 #a8978a,0 2px 0 #66544d,0 3px 1px rgba(20,12,10,.8),0 6px 12px rgba(0,0,0,.5)}

.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(40px,var(--gut-r)) 14px max(40px,var(--gut-l));transition:background .4s}
.top.deep{background:rgba(26,21,20,.92)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top.solid{background:linear-gradient(180deg,rgba(26,21,20,.9),rgba(26,21,20,0))}
.top__mark{font:400 24px/1 var(--display);letter-spacing:.04em;text-decoration:none}
.top__nav{display:flex;gap:clamp(18px,3.4vw,50px);font-size:15px}
.top__nav a{text-decoration:none;position:relative}
.top__nav a::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--wine-hi);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.top__nav a:hover::after{transform:scaleX(1)}
.langs{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:14px}
.langs button{all:unset;cursor:pointer;padding:3px 6px;border-bottom:1px solid transparent}
.langs button[aria-pressed="true"]{color:var(--cream);border-color:var(--wine-hi)}
.langs button:focus-visible{outline:2px solid var(--cream)}

/* Corridor */
.corridor{position:relative;height:2900vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--taupe);perspective:1000px;perspective-origin:50% 48%}
.room{position:absolute;inset:-40px;background:url(images/plate.webp) center/cover;filter:blur(22px) brightness(.82)}
.tint{position:absolute;inset:0;background:var(--room,transparent);opacity:.2;transition:background .8s}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(20,15,13,.5) 100%)}
#dust{position:absolute;inset:0;width:100%;height:100%}
.world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.plane{position:absolute;left:50%;top:50%;width:min(54vw,830px);margin-left:calc(min(54vw,830px) / -2);margin-top:calc(min(54vw,830px) * -.335);
  will-change:transform,opacity;backface-visibility:hidden}
.win{display:block;border-radius:12px;overflow:hidden;background:var(--taupe);border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.55);text-decoration:none}
.win__bar{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;background:#322a27;font-size:12px;color:var(--mute)}
.win__bar i{width:8px;height:8px;border-radius:50%;background:rgba(241,230,218,.25)}
.win__bar i:first-child{background:var(--wine-hi)}
.win__bar span{margin-left:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win img{display:block;width:100%;height:auto;aspect-ratio:8/5;object-fit:cover;object-position:top;filter:sepia(.2) saturate(.82) contrast(1.03);transition:filter .5s}
.win:hover img{filter:none}
.sit{position:absolute;right:7%;bottom:calc(100% - 13px);width:21%;pointer-events:none;opacity:0;transform:translateY(20px);transition:opacity .4s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.plane.on .sit{opacity:1;transform:none}
.sit img{display:block;width:100%;height:auto;transform-origin:50% 100%;animation:sway 4.6s ease-in-out infinite}
.say{position:absolute;right:88%;top:4%;width:max-content;max-width:250px;padding:9px 14px;border-radius:16px;background:rgba(44,37,34,.82);border:1px solid var(--line);font-size:14px;line-height:1.3;color:var(--cream);transform-origin:100% 100%;
  opacity:0;transform:scale(.6);transition:opacity .3s .35s,transform .45s .35s cubic-bezier(.3,1.6,.5,1)}
.plane.on .say{opacity:1;transform:none}

/* Cover */
.cover{position:absolute;inset:0;z-index:4;overflow:hidden;will-change:transform,opacity;transform-origin:62% 40%;background:var(--taupe)}
.scene{position:absolute;left:0;top:0;width:calc(var(--u)*1280);height:calc(var(--u)*800)}
.plate,#gl,#petals{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.plate{object-fit:cover}
.mini{position:absolute;display:block;transform:translate(calc(var(--mx)*var(--dz)*1px),calc(var(--my)*var(--dz)*1px))}
.mini>span{position:absolute;inset:0;display:block;animation:sway var(--t,5s) ease-in-out infinite;transform-origin:var(--ox,50%) 100%}
.mini img{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.mini .head{clip-path:var(--clip);transform-origin:var(--neck);animation:nod var(--n,3.7s) ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(1.1deg) translateY(-1px)}}
@keyframes nod{0%,100%{transform:rotate(-2.2deg)}45%{transform:rotate(2.4deg)}70%{transform:rotate(.4deg)}}
#mD>span{animation:peek 8s ease-in-out infinite;transform-origin:100% 60%}
#mD{-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 96%);mask-image:linear-gradient(180deg,#000 70%,transparent 96%)}
@keyframes peek{0%,100%{transform:translateX(0) rotate(0)}40%{transform:translateX(0) rotate(-2.5deg)}55%{transform:translateX(calc(var(--u)*46)) rotate(4deg)}72%{transform:translateX(calc(var(--u)*46)) rotate(4deg)}86%{transform:translateX(calc(var(--u)*-3)) rotate(-3deg)}}
#mC>span{animation:hop 6.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,64%,100%{transform:translateY(0) rotate(-.7deg)}70%{transform:translateY(calc(var(--u)*-13)) rotate(1.4deg)}76%{transform:translateY(0) rotate(0)}82%{transform:translateY(calc(var(--u)*-6))}88%{transform:translateY(0)}}

.bub{position:absolute;display:grid;place-items:center;padding:calc(var(--u)*8) calc(var(--u)*16);border:1px solid rgba(241,230,218,.55);border-radius:calc(var(--u)*24);background:rgba(58,49,45,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font-size:calc(var(--u)*14.5);line-height:1.25;color:var(--cream);text-align:center;white-space:nowrap;animation:bub 10s ease-in-out infinite both;animation-delay:var(--d,0s)}
.bub::after{content:"";position:absolute;bottom:calc(var(--u)*-7);left:var(--tail,60%);width:calc(var(--u)*12);height:calc(var(--u)*12);border-right:1px solid rgba(241,230,218,.55);border-bottom:1px solid rgba(241,230,218,.55);background:rgba(58,49,45,.6);transform:rotate(45deg) skew(12deg,12deg)}
.bub.b1{display:none}
@keyframes bub{0%{opacity:0;transform:scale(.5) translateY(10px)}6%{opacity:1;transform:scale(1.06)}10%,76%{opacity:1;transform:scale(1)}82%,100%{opacity:0;transform:scale(.7)}}

.tg{position:absolute;left:calc(var(--u)*742);top:calc(var(--u)*712);width:calc(var(--u)*274);height:calc(var(--u)*52);display:flex;align-items:center;gap:calc(var(--u)*18);padding:0 calc(var(--u)*30) 0 calc(var(--u)*38);text-decoration:none;font-size:calc(var(--u)*21);color:var(--cream);transition:transform .25s}
.tg:hover{transform:translateY(calc(var(--u)*-2))}
.tg svg{width:calc(var(--u)*30);height:calc(var(--u)*30);flex:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.6))}
.tg b{font-weight:400;flex:1;white-space:nowrap}
.tg i{font-style:normal;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(calc(var(--u)*6))}}

/* Cover text */
.ui{position:absolute;left:0;right:0;pointer-events:none;perspective:1100px}
.ui a,.ui button{pointer-events:auto}
.col{position:absolute;left:max(5.8vw,48px);top:calc(var(--u)*166);width:calc(var(--u)*430);transform-style:preserve-3d;transform:rotateY(calc(var(--mx)*-7deg)) rotateX(calc(var(--my)*5deg));transform-origin:0 50%}
.mast{position:relative;font:400 calc(var(--u)*94)/1 var(--display);letter-spacing:.005em;height:1.12em;white-space:nowrap;transform-style:preserve-3d;margin:0}
.mast__l{display:inline-block;position:relative;transform-style:preserve-3d;animation:riseL 1.2s cubic-bezier(.2,.8,.2,1) both,bobL 6s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(var(--i)*.25s + 1.6s)}
.mast__l span{position:absolute;left:0;top:0;color:#5c4a43;transform:translateZ(calc(var(--z)*var(--u)*-1.5));pointer-events:none}
.mast__l em{position:relative;display:block;font-style:normal;transform:translateZ(calc(var(--u)*1));
  background:linear-gradient(105deg,#e9dccd 30%,#fff9ef 47%,#e9dccd 62%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes riseL{from{opacity:0;transform:translateY(.5em) rotateX(-70deg)}}
@keyframes bobL{0%,100%{transform:translateZ(0)}50%{transform:translateZ(calc(var(--u)*16))}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-60% 0}}
.bar{height:calc(var(--u)*5);width:calc(var(--u)*78);margin:calc(var(--u)*5) 0 calc(var(--u)*16);border-radius:1px;background:linear-gradient(90deg,var(--wine),var(--wine-hi));transform-origin:left;animation:barIn 1s .8s both}
@keyframes barIn{from{transform:scaleX(0)}}
.tag{font:400 calc(var(--u)*29)/1.17 var(--display);letter-spacing:.012em;transform:translateZ(calc(var(--u)*26));animation:fadeUp 1s .7s both}
.tag span,.tag em{display:block}
.tag em{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3) calc(var(--u)*8);margin-top:calc(var(--u)*13);font-size:calc(var(--u)*12);color:var(--mute);transform:translateZ(calc(var(--u)*16));animation:fadeUp 1s .9s both}
.tags i{font-style:normal;opacity:.6}
.acts0{display:flex;gap:calc(var(--u)*10);margin-top:calc(var(--u)*24);transform:translateZ(calc(var(--u)*36));animation:fadeUp 1s 1.05s both}
.b3{display:inline-flex;align-items:center;gap:calc(var(--u)*12);min-height:calc(var(--u)*50);padding:0 calc(var(--u)*17);border-radius:calc(var(--u)*14);text-decoration:none;font-size:calc(var(--u)*14);line-height:1.2;
  background:linear-gradient(180deg,var(--wine-hi),var(--wine) 58%,#5e1a27);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 4px 0 #3c1019,0 12px 22px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s;white-space:nowrap}
.b3:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #3c1019,0 18px 30px rgba(0,0,0,.5)}
.b3:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 #3c1019}
.b3--line{background:rgba(58,49,45,.45);border:1px solid rgba(241,230,218,.55);box-shadow:0 4px 0 rgba(20,14,12,.55),0 12px 22px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.b3 svg{width:calc(var(--u)*19);height:calc(var(--u)*19);flex:none}
.intro{max-width:calc(var(--u)*400);margin-top:calc(var(--u)*12);font-size:calc(var(--u)*14.5);line-height:1.5;color:#e8dcd1;transform:translateZ(calc(var(--u)*18));animation:fadeUp 1s .85s both}
.go{display:inline-flex;gap:calc(var(--u)*14);margin-top:calc(var(--u)*20);padding-bottom:4px;border-bottom:1px solid var(--wine-hi);font-size:calc(var(--u)*13.5);text-decoration:none;transform:translateZ(calc(var(--u)*20));animation:fadeUp 1s 1.2s both}
.go i{font-style:normal;animation:nudge 2.2s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;translate:0 14px}}

.cards{position:absolute;right:max(4.2vw,36px);top:calc(var(--u)*188);width:calc(var(--u)*272);display:grid;gap:calc(var(--u)*11);transform-style:preserve-3d;transform:rotateY(calc(var(--mx)*-9deg)) rotateX(calc(var(--my)*6deg));transform-origin:100% 50%}
.cardx{display:flex;align-items:center;gap:calc(var(--u)*20);min-height:calc(var(--u)*67);padding:calc(var(--u)*8) calc(var(--u)*18) calc(var(--u)*8) calc(var(--u)*24);border:1px solid rgba(241,230,218,.3);border-radius:calc(var(--u)*11);background:var(--glass);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);text-decoration:none;font-size:calc(var(--u)*14);line-height:1.34;
  box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),background .3s;animation:floatC 6s ease-in-out infinite;animation-delay:calc(var(--i)*-1.3s)}
.cardx:hover{transform:translateZ(calc(var(--u)*46)) translateX(calc(var(--u)*-8));background:rgba(122,36,51,.72)}
.cardx svg{width:calc(var(--u)*30);height:calc(var(--u)*30);flex:none}
.cardx span{flex:1;min-width:0}
.cardx i{font-style:normal;transition:transform .3s}
.cardx:hover i{transform:translateX(calc(var(--u)*5))}
@keyframes floatC{0%,100%{translate:0 0}50%{translate:0 calc(var(--u)*-5)}}

.howto{position:absolute;right:calc(max(4.2vw,36px) + var(--u)*24);top:calc(var(--u)*614);display:flex;align-items:center;gap:calc(var(--u)*20);padding:calc(var(--u)*9) calc(var(--u)*14) calc(var(--u)*9) calc(var(--u)*26);border:1px solid rgba(241,230,218,.55);border-radius:calc(var(--u)*40);background:rgba(58,49,45,.45);color:var(--cream);font:400 calc(var(--u)*15)/1.3 var(--body);text-align:left;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.howto b{position:relative;display:grid;place-items:center;width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;background:linear-gradient(180deg,var(--wine-hi),var(--wine));font-weight:400}
.howto b::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--wine-hi);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}

/* Text beside the active window */
.hud{position:absolute;left:max(40px,var(--gut-l));top:50%;transform:translateY(-50%);width:min(31vw,430px);z-index:3;display:grid}
.card{grid-area:1/1;align-self:center;display:grid;gap:13px;padding:26px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .5s,transform .6s,visibility .5s;transform:translateY(18px)}
.card.on{opacity:1;visibility:visible;transform:none}
.card__type{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#e3a5ad}
.card__type em{font-style:normal;color:var(--mute);font-weight:500}
.card h2{font:400 clamp(34px,3.8vw,56px)/1.06 var(--display);overflow-wrap:anywhere}
.card p{color:#e8dcd1;max-width:38ch}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.acts .b3{--u:1px;min-height:46px;padding:0 18px;font-size:14px;border-radius:12px}

.rail{position:absolute;right:max(24px,var(--gut-r));top:50%;transform:translateY(-50%);z-index:3;display:grid;gap:4px}
.rail a{display:block;padding:6px 4px}
.rail a i{display:block;width:18px;height:2px;background:rgba(241,230,218,.3);transition:width .3s,background .3s}
.rail a.on i{width:32px;background:var(--wine-hi)}
.count{position:absolute;right:max(28px,var(--gut-r));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:3;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* Below the corridor */
.wrap{max-width:1160px;margin:0 auto;padding-left:max(28px,var(--gut-l));padding-right:max(28px,var(--gut-r))}
.index{padding-block:110px 90px;background:var(--taupe)}
.index h2,.talk h2{font:400 clamp(38px,6vw,76px)/1.06 var(--display)}
.list{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .25s,color .25s}
.row:hover{padding-left:12px;color:#e3a5ad}
.row b{font:400 clamp(23px,2.6vw,31px)/1.2 var(--display)}
.row span{font-size:14px;color:var(--mute)}
.row u{text-decoration:none;font-size:14px;white-space:nowrap}

.talk{padding-block:100px 70px;background:linear-gradient(180deg,var(--taupe),#40161f)}
.talk__grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:end}
.talk h2 em{font-style:italic}
.talk p{margin-top:18px;max-width:46ch;color:#e8dcd1}
.reach{display:grid;gap:12px;margin-top:16px}
.phone a{text-decoration:none;font-variant-numeric:tabular-nums}
.picks{margin-top:26px}
.picks__h{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#e3a5ad;margin-bottom:10px}
.picks__list{display:flex;flex-wrap:wrap;gap:8px;color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border:1px solid var(--line);border-radius:30px;background:rgba(122,36,51,.35);color:var(--cream);font:500 14px var(--body)}
.chip button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}
.chip button:hover{background:rgba(241,230,218,.12);color:var(--cream)}
.req{display:grid;gap:16px;padding:26px;border:1px solid var(--line);border-radius:18px;background:rgba(26,21,20,.45);backdrop-filter:blur(8px)}
.pk{border:0;margin:0;padding:0;display:grid;gap:8px}
.pk legend{padding:0;margin-bottom:10px;font:400 26px/1.15 var(--display)}
.pk label{cursor:pointer}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk label>span{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;transition:border-color .2s,background .2s,transform .15s}

    $("kStyle").innerHTML=Object.keys(c.st).map(function(k){return '<label class="opt"><input type="radio" name="kst" value="'+k+'"'+(kit.style===k?" checked":"")+'><span><b>'+c.st[k][0]+'</b><small>'+c.st[k][1]+'</small></span></label>'}).join("");
    $("kPal").innerHTML=Object.keys(PAL).map(function(k){var p=PAL[k];return '<label><input type="radio" name="kpal" value="'+k+'"'+(kit.pal===k?" checked":"")+'><span><i><u style="background:'+p[0]+'"></u><u style="background:'+p[1]+'"></u><u style="background:'+p[2]+'"></u><u style="background:'+p[3]+'"></u></i>'+c.pal[k]+'</span></label>'}).join("")+
      '<label class="own"><input type="radio" name="kpal" value="own"'+(kit.pal==="own"?" checked":"")+'><span><i'+(kit.own?' style="background:'+kit.own+'"':'')+'><input type="color" id="kOwn" value="'+(kit.own||"#a23a4b")+'" aria-label="'+c.own+'"></i>'+c.own+'</span></label>';
    $("kFont").innerHTML=Object.keys(FONT).map(function(k){return '<label class="opt"><input type="radio" name="kfont" value="'+k+'"'+(kit.font===k?" checked":"")+'><span><span class="aa" style="font-family:'+FONT[k][0].replace(/"/g,"'")+'">Aa</span><b style="font-family:'+FONT[k][1].replace(/"/g,"'")+'">'+c.font[k][0]+'</b><small>'+c.font[k][1]+'</small></span></label>'}).join("");
    $("kBlocks").innerHTML=BLOCKS.map(function(k){return '<label><input type="checkbox" value="'+k+'"'+(kit.blocks[k]?" checked":"")+'><span>'+c.bl[k]+'</span></label>'}).join("");
    document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=c[e.dataset.k]});
  }

  function renderMock(){
    var c=CT[lang],m=c.m,b=kit.blocks,mock=$("mock");
    var p=(PAL[kit.pal]||PAL.noir).slice();
    if(kit.pal==="own"&&kit.own){var base=lum(kit.own)>.6?PAL.graph:PAL.noir;p=[base[0],base[1],base[2],kit.own]}
    var f=FONT[kit.font]||FONT.classic;
    mock.className="mock st-"+kit.style;
    var v={"--m-bg":p[0],"--m-sf":p[1],"--m-ink":p[2],"--m-ac":p[3],"--m-on":lum(p[3])>.62?"#1a1514":"#fff","--m-r":STYLE_R[kit.style],"--m-fd":f[0],"--m-fb":f[1]};
    for(var k in v)mock.style.setProperty(k,v[k]);
    var name=esc(kit.name.trim()||c.def_name);
    var h='<div class="m-bar"><i></i><i></i><i></i><span>'+(kit.name.trim()?esc(kit.name.trim().toLowerCase().replace(/\s+/g,"-")):"your-site")+'.com</span></div>'+
      '<div class="m-nav"><span class="m-logo">'+name+'</span><span class="m-links">'+m.services.split(" ")[0]+' · '+c.nav[0]+' · '+c.nav[2]+(b.langs?' · <em>UA RU CZ EN</em>':'')+'</span></div>'+
      '<div class="m-hero"><span class="m-eye">'+c.eye+'</span><h3 class="m-h">'+name+'</h3><p class="m-p">'+c.tagline+'</p><div class="m-acts"><span class="m-btn">'+c.btn+'</span><span class="m-btn m-btn--o">'+c.btn2+'</span></div>'+(kit.style==="creme"||kit.style==="silk"?'<div class="m-img"></div>':'')+'</div>';
    var card=function(t){return '<div class="m-card"><b>'+t+'</b><span class="m-line"></span><span class="m-line s"></span></div>'};
    if(b.services)h+='<div class="m-sec"><h4>'+m.services+'</h4><div class="m-grid">'+m.item.map(card).join("")+'</div></div>';
    if(b.gallery)h+='<div class="m-sec"><h4>'+m.gallery+'</h4><div class="m-gal">'+[5,2,4,1,3].map(function(k){return '<u style="--k:'+k+'"></u>'}).join("")+'</div></div>';
    if(b.prices)h+='<div class="m-sec"><h4>'+m.prices+'</h4>'+m.item.map(function(t,i){return '<div class="m-row"><b>'+t+'</b><i>'+[45,70,30][i]+' €</i></div>'}).join("")+'</div>';
    if(b.shop)h+='<div class="m-sec m-shop"><h4>'+m.shop+'</h4><div class="m-grid">'+[24,38,19].map(function(pr){return '<div class="m-card"><u></u><span class="m-line s"></span><i>'+pr+' €</i></div>'}).join("")+'</div></div>';
    if(b.reviews)h+='<div class="m-sec"><h4>'+m.reviews+'</h4><div class="m-q">'+m.review+'<small>'+m.client+' · ★★★★★</small></div></div>';
    if(b.blog)h+='<div class="m-sec m-blog"><h4>'+m.blog+'</h4>'+m.post.map(function(t){return '<div class="m-row"><b>'+t+'</b><span>→</span></div>'}).join("")+'</div>';
    if(b.booking)h+='<div class="m-sec"><h4>'+m.booking+'</h4><div class="m-form"><u></u><u></u><u></u><u></u><span class="m-btn">'+m.book+'</span></div></div>';
    h+='<div class="m-foot"><span>'+name+'</span><span>© 2026</span></div>';
    if(b.tg)h+='<div class="m-tg">✈ <span>'+m.chat+'</span></div>';
    mock.innerHTML=h;
  }
  function kitSync(){buildOptions();renderMock();renderPicks()}

  $("req").addEventListener("input",function(e){
    var el=e.target;
    if(el.id==="kName"){kit.name=el.value}
    else if(el.id==="kOwn"){kit.own=el.value;kit.pal="own";el.closest("i").style.background=el.value;var r=el.closest("label").querySelector('input[type=radio]');r.checked=true}
    else return;
    saveKit();renderMock();
  });
  $("req").addEventListener("change",function(e){
    var el=e.target;
    if(el.name==="kst"){kit.style=el.value;kit.pal=STYLE_PAL[el.value];var pr=document.querySelector('input[name="kpal"][value="'+kit.pal+'"]');if(pr)pr.checked=true}
    else if(el.name==="kpal"){kit.pal=el.value}
    else if(el.name==="kfont"){kit.font=el.value}
    else if(el.type==="checkbox"){kit.blocks[el.value]=el.checked?1:0;
      if(el.value==="tg"&&el.checked){var pb=document.querySelector('input[name="pk"][value="bot"]');if(pb)pb.checked=true}}
    else return;
    saveKit();renderMock();
  });
  /* extra fonts load only when the builder is near */
  (function(){
    var done=false;function load(){if(done)return;done=true;var l=document.createElement("link");l.rel="stylesheet";
      l.href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Montserrat:wght@500;700&family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito:wght@400;600&display=swap&subset=cyrillic,latin,latin-ext";
      document.head.appendChild(l)}
    if("IntersectionObserver" in window){var io=new IntersectionObserver(function(en){if(en.some(function(x){return x.isIntersecting})){load();io.disconnect()}},{rootMargin:"900px"});io.observe($("talk"))}else load();
  })();
  function deepTop(){$("topbar").classList.toggle("deep",scrollY>$("index").offsetTop-60)}
  addEventListener("scroll",deepTop,{passive:true});deepTop();
  var _setLang2=setLang;setLang=function(l){_setLang2(l);kitSync()};

  /* ---------- Request ---------- */
  $("req").addEventListener("submit",function(e){
    e.preventDefault();
    var t=T[lang],c=CT[lang],r=c.r,pk=(document.querySelector('input[name="pk"]:checked')||{}).value||"site";
    var price={site:"250–350 €",bot:"450–1100 €",unsure:""}[pk];
    var msg=$("msg").value.trim();
    var bl=BLOCKS.filter(function(k){return kit.blocks[k]}).map(function(k){return c.bl[k]});
    var lines=[t.m_hi];
    if(kit.name.trim())lines.push(r.name+": "+kit.name.trim());
    lines.push(r.style+": "+c.st[kit.style][0]);
    lines.push(r.pal+": "+(kit.pal==="own"?c.own+" "+(kit.own||""):c.pal[kit.pal]));
    lines.push(r.font+": "+c.font[kit.font][0]+" ("+c.font[kit.font][1]+")");
    if(bl.length)lines.push(r.blocks+": "+bl.join(", "));
    if(picks.length)lines.push(t.m_like+": "+picks.map(nameOf).join(", "));
    lines.push(t.m_pk+": "+t["pk_"+pk]+(price?" ("+price+")":""));
    if(msg)lines.push(t.m_me+": "+msg);
    var text=lines.join("\n"),url;
    if(BOT){url="https://t.me/"+BOT+"?start="+("p_"+(picks.join("-")||"none")+"_"+pk+"_"+lang).slice(0,64);$("reqOk").textContent=t.sent_bot}
    else{url="https://t.me/Didera_Web?text="+encodeURIComponent(text);$("reqOk").textContent=t.sent_copy;
      try{navigator.clipboard.writeText(text)}catch(x){}}
    window.open(url,"_blank","noopener");
  });
  document.querySelectorAll("[data-lead]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();$("talk").scrollIntoView({behavior:"smooth"})})});

  setLang(lang);

  $("copy").addEventListener("click",function(){
    var b=this,tt=$("tel").textContent;
    var done=function(){b.textContent=T[lang].copied;setTimeout(function(){b.textContent=T[lang].copy},1800)};
    function sel(){var r=document.createRange();r.selectNodeContents($("tel"));var s=getSelection();s.removeAllRanges();s.addRange(r)}
    try{navigator.clipboard.writeText(tt).then(done,sel)}catch(e){sel()}
  });

  /* ---------- Fit the scene to any screen ---------- */
  var stage=$("stage"),scene=$("scene"),ui=$("ui"),W=0,H=0,tall=false;
  function layout(){
    W=stage.clientWidth;H=stage.clientHeight;tall=W/H<1.22;
    root.classList.toggle("tall",tall);
    var u=tall?Math.max(W/1280,H*.6/800):Math.max(W/1280,H/800),sw=1280*u,sh=800*u;
    var cx=tall?720:640,left=Math.min(0,Math.max(W-sw,W/2-cx*u)),top=tall?0:H-sh;
    root.style.setProperty("--sceneH",sh+"px");
    root.style.setProperty("--u",u+"px");
    scene.style.transform="translate("+left+"px,"+top+"px)";
    ui.style.top=top+"px";ui.style.height=sh+"px";
  }
  layout();

  var flat=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(flat){root.classList.add("flat");addEventListener("resize",layout);return}

  /* ---------- Living picture: depth, breathing, blinking, moving leaves ---------- */
  function startGL(){
    var c=$("gl"),gl=c.getContext("webgl",{antialias:false,alpha:false});
    if(!gl){c.hidden=true;return null}
    var vs="attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}";
    var fs=[
    "precision highp float;varying vec2 v;uniform sampler2D A,M;uniform vec2 m;uniform float t,bl;",
    "void eye(inout vec2 q,vec2 c,vec2 r){vec2 e=(q-c)/r;float k=1.-smoothstep(.55,1.05,length(e));q.y-=bl*k*r.y*(.9+e.y);}",
    "void main(){vec3 d=texture2D(M,v).rgb;vec2 q=v;",
    "q-=m*(d.r-.3)*vec2(.016,.012);",
    "q+=d.g*vec2(sin(t*1.15+v.y*16.)*.0042,cos(t*.9+v.x*13.)*.0026);",
    "q.y+=d.b*sin(t*1.2)*.0021;",
    "eye(q,vec2(.5825,.4063),vec2(.0228,.0150));eye(q,vec2(.6328,.4300),vec2(.0130,.0120));",
    "vec3 c=texture2D(A,q).rgb;",
    "float g=sin(t*.22+v.x*2.2-v.y*1.4);c+=vec3(.05,.028,.02)*smoothstep(.55,1.,g)*(1.-d.r*.5);",
    "gl_FragColor=vec4(c,1.);}"].join("");
    function sh(ty,s){var o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o}
    var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){c.hidden=true;return null}
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    var ap=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
    var ready=0;
    function tex(u,src){var i=new Image();i.onload=function(){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,i);ready++};i.src=src}
    tex(0,"images/plate.webp");tex(1,"images/map.png");
    gl.uniform1i(gl.getUniformLocation(pr,"A"),0);gl.uniform1i(gl.getUniformLocation(pr,"M"),1);
    var um=gl.getUniformLocation(pr,"m"),ut=gl.getUniformLocation(pr,"t"),ub=gl.getUniformLocation(pr,"bl");
    function size(){var r=Math.min(devicePixelRatio||1,2),w=Math.round(c.clientWidth*r),h=Math.round(c.clientHeight*r);if(c.width!==w||c.height!==h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}}
    return {draw:function(t,mx,my,blink){if(ready<2)return;size();gl.uniform2f(um,mx,my);gl.uniform1f(ut,t);gl.uniform1f(ub,blink);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}};
  }
  var glApi=startGL();

  /* ---------- Petals and steam ---------- */
  var pc=$("petals"),px=pc.getContext("2d"),leaves=[],steam=[];
  for(var i=0;i<16;i++)leaves.push({x:Math.random()*.34,y:Math.random(),s:.6+Math.random()*.9,r:Math.random()*6.3,v:.018+Math.random()*.02,p:Math.random()*6.3});
  for(i=0;i<9;i++)steam.push({l:i/9,o:Math.random()*6.3});
  function petals(t,dt){
    var r=Math.min(devicePixelRatio||1,1.5),w=pc.clientWidth,h=pc.clientHeight;
    if(pc.width!==Math.round(w*r)){pc.width=Math.round(w*r);pc.height=Math.round(h*r)}
    px.setTransform(r,0,0,r,0,0);px.clearRect(0,0,w,h);
    var u=w/1280;
    leaves.forEach(function(p){
      p.y+=p.v*dt;p.r+=dt*.9;if(p.y>.92){p.y=.02;p.x=Math.random()*.32}
      var x=(p.x+Math.sin(t*.6+p.p)*.018+p.y*.06)*w,y=p.y*h,a=Math.min(1,p.y*8)*Math.min(1,(.92-p.y)*7);
      px.save();px.translate(x,y);px.rotate(p.r);px.scale(1,Math.cos(p.r*1.4)*.6+.5);px.globalAlpha=a*.9;px.fillStyle=p.p>3?"#7a2433":"#99313f";
      px.beginPath();px.ellipse(0,0,6.5*p.s*u,3.1*p.s*u,0,0,6.3);px.fill();px.restore();
    });
    steam.forEach(function(s){
      var l=(t*.09+s.l)%1,x=(54+Math.sin(t*.8+s.o+l*5)*(5+l*11))*u,y=(668-l*92)*u,rd=(5+l*17)*u;
      var gr=px.createRadialGradient(x,y,0,x,y,rd);gr.addColorStop(0,"rgba(241,230,218,"+(.15*(1-l))+")");gr.addColorStop(1,"rgba(241,230,218,0)");
      px.fillStyle=gr;px.beginPath();px.arc(x,y,rd,0,6.3);px.fill();
    });
  }

  /* ---------- Scroll flight ---------- */
  var corridor=$("corridor"),cover=$("cover"),canvas=$("dust"),ctx=canvas.getContext("2d"),topbar=$("topbar");
  var D=1250,n=works.length,cur=0,mx=0,my=0,rx=0,ry=0;
  function resize(){
    layout();
    var r=Math.min(devicePixelRatio||1,2);
    canvas.width=W*r;canvas.height=H*r;ctx.setTransform(r,0,0,r,0,0);
  }
  addEventListener("resize",resize);resize();

  function progress(){
    var max=corridor.offsetHeight-stage.offsetHeight;
    return Math.min(1,Math.max(0,-corridor.getBoundingClientRect().top/max))*n;
  }
  function dwell(p){
    var i=Math.floor(p),f=p-i,s=Math.min(1,Math.max(0,(f-.5)/.4));
    return i+s*s*(3-2*s);
  }
  function goTo(i){
    var max=corridor.offsetHeight-stage.offsetHeight;
    scrollTo({top:corridor.offsetTop+max*(i/n)});
  }
  document.querySelectorAll("[data-go]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();goTo(+a.dataset.go)})});
  $("tourBtn").addEventListener("click",function(e){e.preventDefault();goTo(1)});
  $("hud").addEventListener("click",function(e){var b=e.target.closest("[data-step]");if(!b)return;var k=+b.dataset.step;
    if(k>n){$("talk").scrollIntoView({behavior:"smooth"})}else goTo(Math.max(0,k))});
  $("howto").addEventListener("click",function(){goTo(1)});
  addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});

  var stars=[];
  for(var s=0;s<110;s++)stars.push({x:(Math.random()-.5)*2600,y:(Math.random()-.5)*1700,z:Math.random()*5000,red:Math.random()<.5});
  function dust(cam){
    ctx.clearRect(0,0,W,H);
    stars.forEach(function(p){
      var z=((p.z-cam)%5000+5000)%5000+40,k=700/z,x=W/2+p.x*k,y=H/2+p.y*k;
      ctx.fillStyle=p.red?"#a23a4b":"#e9dccd";
      ctx.globalAlpha=Math.min(.7,k*.8)*Math.min(1,(5040-z)/1200);
      ctx.beginPath();ctx.ellipse(x,y,Math.min(3.4,k*2.2),Math.min(1.6,k*1),z*.01,0,6.3);ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  var nextBlink=2.2,blink=0,blinkT=-9;
  var last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;var t=now/1000;
    var goal=dwell(progress());
    cur+=(goal-cur)*.055;
    if(Math.abs(goal-cur)<.0005)cur=goal;
    rx+=(mx-rx)*.06;ry+=(my-ry)*.06;
    root.style.setProperty("--mx",rx.toFixed(3));root.style.setProperty("--my",ry.toFixed(3));

    var hop=1-Math.min(1,cur/.55);
    cover.style.opacity=hop.toFixed(3);
    cover.style.visibility=hop<=0?"hidden":"visible";
    cover.style.transform="scale("+(1+cur*1.7).toFixed(3)+")";
    cover.style.pointerEvents=hop<.6?"none":"";
    topbar.classList.toggle("solid",cur>.3);

    if(hop>0){
      if(t>nextBlink){blinkT=t;nextBlink=t+2.6+Math.random()*3.4}
      var bp=(t-blinkT)/.19;blink=bp>=0&&bp<=1?Math.sin(bp*3.1416):0;
      if(glApi)glApi.draw(t,rx*2,ry*2,blink);
      petals(t,dt);
    }

    world.style.transform="rotateY("+(rx*6).toFixed(2)+"deg) rotateX("+(-ry*4).toFixed(2)+"deg)";
    var near=Math.round(cur);
    works.forEach(function(w,i){
      var id=i+1,z=(cur-id)*D,far=Math.max(0,-z/D),side=i%2?-1:1;
      var ax=tall?0:W*.17,ay=tall?-H*.17:0;
      var x=ax+side*Math.min(far,3)*W*.24*(tall?.55:1),y=ay+((i%3)-1)*Math.min(far,3)*H*.12;
      var op=z>0?1-z/420:Math.min(1,(3.4-far)/1.1);
      op=Math.max(0,Math.min(1,op))*Math.min(1,Math.max(0,(cur-.2)/.5));
      w.el.style.opacity=op.toFixed(3);
      w.el.style.visibility=op<=0?"hidden":"visible";
      var on=Math.abs(cur-id)<.28;
      w.el.style.pointerEvents=on?"auto":"none";
      w.el.classList.toggle("on",on);
      w.el.style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,"+z.toFixed(1)+"px) rotateY("+(side*Math.min(far,1)*-14).toFixed(2)+"deg)";
      w.card.classList.toggle("on",on);
      w.dot.classList.toggle("on",near===id);
    });
    stage.style.setProperty("--room",near>=1?works[near-1].room:"transparent");
    count.textContent=near>=1?near+" / "+n:"";
    dust(cur*D);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
